services:
  craft-portal:
    build: .
    image: craft-portal:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CRAFT_PUBLIC_URL: ${CRAFT_PUBLIC_URL:-http://localhost:8080}
      CRAFT_SINGLE_APP_URL: ${CRAFT_SINGLE_APP_URL:-}
      CRAFT_APPS_DOMAIN: ${CRAFT_APPS_DOMAIN:-}
      CRAFT_AUTO_START_UPDATES: ${CRAFT_AUTO_START_UPDATES:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - craft-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  craft-data:
