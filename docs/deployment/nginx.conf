# Include inside nginx's http {} context. Replace all example hostnames,
# certificate paths and upstream address before use. Default server rejects
# unexpected Host/SNI values. The TLS certificate must cover both names.
limit_req_zone $binary_remote_addr zone=craft_login:10m rate=5r/m;
upstream craft_portal { server 127.0.0.1:8080; }
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name craft.example.com craft-apps.example.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    server_name craft.example.com craft-apps.example.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    # No request-body logging, cache, auth proxy or HTML injection: preserve
    # application CSP, COOP/COEP, cookies and versioned asset responses.
    location = /api/login {
        limit_req zone=craft_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://craft_portal;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }
    location / {
        proxy_pass http://craft_portal;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # URLs containing malicious credentials must not enter access logs.
        access_log off;
    }
}
