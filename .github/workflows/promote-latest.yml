name: Promote verified image to latest
on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-latest.yml']
permissions:
  contents: read
  packages: write
jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the CI-verified rc.4 image without rebuilding
        env:
          VERIFIED_DIGEST: sha256:bd274e4c4dd305c8ff6c9bc5e84296cc18bebc629d78295f9bbe2163b2a0405e
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:latest" "$image@$VERIFIED_DIGEST"
          actual=$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')
          test "$actual" = "$VERIFIED_DIGEST"
