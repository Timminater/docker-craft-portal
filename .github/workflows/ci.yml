name: CI
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q portal
      - run: python -m pytest -q
      - run: node --check portal/static/app.js
      - run: node --check portal/static/bridge.js
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium firefox
      - name: Allow ephemeral TLS isolation fixture on port 443
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - run: python -m pytest tests/browser -q --junitxml="$RUNNER_TEMP/browser-results.xml"
        env:
          CRAFT_BROWSER_TESTS: '1'
          CRAFT_REQUIRE_BROWSERS: '1'
      - name: Report browser failure details
        if: failure()
        run: |
          python - <<'PYREPORT'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path(os.environ['RUNNER_TEMP']) / 'browser-results.xml'
          if report.exists():
              for case in ET.parse(report).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      message = failure.get('message', '') + '\n' + (failure.text or '')[-1800:]
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      name = case.get('name', 'browser').replace(',', '_').replace('\n', ' ')
                      print(f'::error title={name}::{message}')
          PYREPORT
  container-build:
    needs: [tests, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: craft-portal:ci
          cache-from: type=gha
      - name: Verify hardened nonroot runtime
        run: |
          docker volume create craft-ci
          docker run -d --name craft-ci --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -e CRAFT_AUTO_START_UPDATES=false -v craft-ci:/data craft-portal:ci
          trap 'docker rm -f craft-ci; docker volume rm craft-ci' EXIT
          test "$(docker exec craft-ci id -u)" = 10001
          for attempt in $(seq 1 30); do
            if docker exec craft-ci python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=2)' ; then break; fi
            sleep 1
          done
          docker exec craft-ci python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=2)'
          docker exec craft-ci test -s /data/database/portal.sqlite
          docker exec craft-ci python -c 'from pathlib import Path; Path("/data/restart-check").write_text("persisted")'
          docker restart craft-ci
          test "$(docker exec craft-ci cat /data/restart-check)" = persisted
